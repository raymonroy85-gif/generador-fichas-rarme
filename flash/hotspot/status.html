<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status</title><meta http-equiv="refresh" content="$(refresh-timeout-secs)"><link rel="stylesheet" href="style.css"></head><body><div class="container"><img src="img/logo.png" class="logo-img"><div class="welcome-box"><h2>¡Bienvenido a Farmacia RARME!</h2><p>Ya estás conectado a nuestra red WiFi.</p><p class="welcome-sub">Disfruta tu navegación</p></div><h3>Conectado</h3><div style="margin-bottom:15px;text-align:left;font-size:0.9rem"><p><strong>Usuario:</strong> $(username)</p><p><strong>IP:</strong> $(ip)</p><p><strong>Tiempo:</strong> $(uptime)</p><p><strong>Tráfico:</strong> $(bytes-in-nice) / $(bytes-out-nice)</p></div><form action="$(link-logout)" name="logout" onSubmit="return openLogout()"><button type="submit" class="btn-login" style="background:#ef4444;color:white">Desconectar</button></form></div></body></html>
