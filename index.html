<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RARME Voucher Generator</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="app">

    <!-- HEADER -->
    <header class="topbar">
      <div class="brand">
        <div class="logo-box">R</div>
        <div>
          <h1 id="tituloProducto">RARME Voucher Generator</h1>
          <p>Generador de fichas MikroTik</p>
        </div>
      </div>
      <div class="version" id="lblVersion"></div>
    </header>

    <!-- CONFIG COMPACTO -->
    <section class="panel panel-config">
      <div class="panel-body">
        <div class="config-row">
          <div class="config-info">
            <strong>Configuración</strong>
            <span id="configName">Ningún archivo cargado</span>
          </div>
          <label class="btn btn-secondary" for="fileConfig">📁 Cargar config.json</label>
          <input type="file" id="fileConfig" accept=".json">
        </div>
      </div>
    </section>

    <!-- MAIN GRID -->
    <div class="grid">

      <!-- DATOS DEL NEGOCIO -->
      <section class="panel">
        <div class="panel-head">
          <span class="icon">🏪</span>
          <h2>Datos del Negocio</h2>
        </div>
        <div class="panel-body form-readonly">
          <div class="field">
            <label>Empresa</label>
            <input type="text" id="txtEmpresa" readonly>
          </div>
          <div class="field">
            <label>WhatsApp</label>
            <input type="text" id="txtWhatsapp" readonly>
          </div>
          <div class="field">
            <label>Portal</label>
            <input type="text" id="txtPortal" readonly>
          </div>
          <div class="field">
            <label>Nombre de Red</label>
            <input type="text" id="txtNombreRed" readonly>
          </div>
        </div>
      </section>

      <!-- GENERACIÓN -->
      <section class="panel">
        <div class="panel-head">
          <span class="icon">🎫</span>
          <h2>Generación</h2>
        </div>
        <div class="panel-body">
          <div class="field">
            <label>Perfil</label>
            <select id="cmbPerfil"></select>
          </div>
          <div class="field">
            <label>Cantidad</label>
            <select id="txtCantidad">
              <option value="30">30</option>
              <option value="60">60</option>
              <option value="90">90</option>
              <option value="120">120</option>
            </select>
          </div>
          <div class="field">
            <label>Longitud del PIN</label>
            <input type="number" id="txtLongitud" min="1" max="20">
          </div>
          <div class="field field-check">
            <label>
              <input type="checkbox" id="chkUsuarioPassword" checked>
              <span>Usuario = Contraseña</span>
            </label>
          </div>
          <div class="actions">
            <button class="btn btn-primary" id="btnGenerar">
              <span>✨</span> Generar Fichas
            </button>
            <button class="btn btn-success" id="btnScript">
              <span>📜</span> Generar Script
            </button>
            <button class="btn btn-warning" id="btnPdf">
              <span>📄</span> Generar PDF
            </button>
          </div>
        </div>
      </section>

    </div>

    <!-- VISTA PREVIA -->
    <section class="panel panel-wide">
      <div class="panel-head">
        <span class="icon">👁️</span>
        <h2>Vista Previa</h2>
      </div>
      <div class="panel-body">
        <div id="preview" class="preview-ticket"></div>
      </div>
    </section>

    <!-- SCRIPT -->
    <section class="panel panel-wide">
      <div class="panel-head">
        <span class="icon">📜</span>
        <h2>Script MikroTik</h2>
        <button class="btn btn-copy" id="btnCopiarScript" type="button">
          📋 Copiar todo
        </button>
      </div>
      <div class="panel-body">
        <textarea id="txtScript" readonly placeholder="Aquí aparecerá el script para MikroTik..."></textarea>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
